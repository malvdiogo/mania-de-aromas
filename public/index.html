<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mania de Aromas Outlet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="/css/style.css"></head><body>
<div class="bar" id="bar">Perfumaria · Cosméticos · Maquiagem · Preços abaixo do catálogo</div>
<div class="top"><header><a href="#/"><img src="/images/logo.png" alt="Mania de Aromas Outlet"></a><nav aria-label="Principal"><a href="#/">Início</a><a href="#/catalogo">Produtos</a><a href="#/contato">Contato</a><a href="#/admin">Admin</a></nav><div class="header-actions"><button class="btn theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema" title="Alternar tema">☾ <span>Escuro</span></button><a class="btn dark" href="#/carrinho">Carrinho (<span id="cc">0</span>)</a></div></header></div>
<main id="app" class="w" style="padding:0"><p class="loading">Carregando…</p></main><div id="toast" role="status"></div>
<footer><div class="w" id="foot"></div></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),R=c=>'R$ '+(c/100).toFixed(2).replace('.',',');

const applyTheme=theme=>{document.documentElement.dataset.theme=theme;localStorage.setItem('mania-theme',theme);const b=$('#themeToggle');if(b){b.innerHTML=theme==='dark'?'☀ <span>Claro</span>':'☾ <span>Escuro</span>';b.setAttribute('aria-label',theme==='dark'?'Ativar tema claro':'Ativar tema escuro')}};
applyTheme(localStorage.getItem('mania-theme')||'light');
document.addEventListener('click',e=>{if(e.target.closest('#themeToggle'))applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')});
const api=async(u,o={})=>{const f=o.body instanceof FormData;const r=await fetch(u,{credentials:'same-origin',...o,body:o.body&&!f&&typeof o.body!=='string'?JSON.stringify(o.body):o.body,headers:{'X-Requested-With':'fetch',...(o.body&&!f?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro');return d};
let cart=[];try{cart=JSON.parse(localStorage.getItem('cart')||'[]')}catch{}
let P=[],S={categories:[]},F={q:'',cat:'',sort:'name',n:12};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2500)};
const save=()=>{localStorage.setItem('cart',JSON.stringify(cart));$('#cc').textContent=cart.reduce((a,i)=>a+i.qty,0)};
const un=p=>p.promo_cents??p.price_cents;
const img=p=>p.image?`<img class="pi product-preview" src="${esc(p.image)}" data-image1="${esc(p.image)}" data-image2="${esc(p.image2||p.image)}" alt="${esc(p.name)}" loading="lazy">`:`<div class="pi">Sem imagem</div>`;
const pr=p=>p.promo_cents!=null?`<s>${R(p.price_cents)}</s> <b>${R(p.promo_cents)}</b>`:`<b>${R(p.price_cents)}</b>`;
const card=p=>`<article class="card"><a href="#/p/${p.id}">${img(p)}</a><div class="cb"><small>${esc(p.category||'')}</small><a href="#/p/${p.id}"><b>${esc(p.name)}</b></a><span>${pr(p)}</span><button class="btn dark" data-add="${p.id}">Adicionar ao carrinho</button></div></article>`;
let featureTimer=null;
const featureMarkup=()=>{const list=(P.some(p=>p.featured)?P.filter(p=>p.featured):P).filter(p=>p.stock>0).slice(0,8);if(!list.length)return '<p class="muted">Nenhum produto em destaque no momento.</p>';return `<div class="feature-carousel" id="featureCarousel"><div class="feature-track">${list.map((p,i)=>`<article class="feature-slide ${i===0?'active':''}" data-slide="${i}"><a class="feature-images" href="#/p/${p.id}"><img src="${esc(p.image||'/images/logo.png')}" alt="${esc(p.name)}" loading="lazy"><img src="${esc(p.image2||p.image||'/images/logo.png')}" alt="${esc(p.name)} — segunda imagem" loading="lazy"></a><div class="feature-copy"><small>${esc(p.category||'Destaque')}</small><h3>${esc(p.name)}</h3><p>${esc(p.description||'Conheça este produto disponível na Mania de Aromas.')}</p><strong>${pr(p)}</strong><a class="btn dark" href="#/p/${p.id}">Ver produto</a></div></article>`).join('')}</div><div class="feature-controls"><button class="btn" type="button" data-feature-prev aria-label="Produto anterior">‹</button><div class="feature-dots">${list.map((p,i)=>`<button type="button" data-feature-dot="${i}" aria-label="Ir para produto ${i+1}" class="${i===0?'active':''}"></button>`).join('')}</div><button class="btn" type="button" data-feature-next aria-label="Próximo produto">›</button></div></div>`};
const startFeatureCarousel=()=>{if(featureTimer)clearInterval(featureTimer);const root=$('#featureCarousel');if(!root)return;const slides=[...root.querySelectorAll('.feature-slide')],dots=[...root.querySelectorAll('[data-feature-dot]')];if(slides.length<2)return;let i=0;const show=n=>{i=(n+slides.length)%slides.length;slides.forEach((x,j)=>x.classList.toggle('active',j===i));dots.forEach((x,j)=>x.classList.toggle('active',j===i))};root.querySelector('[data-feature-prev]').onclick=()=>show(i-1);root.querySelector('[data-feature-next]').onclick=()=>show(i+1);dots.forEach((d,j)=>d.onclick=()=>show(j));featureTimer=setInterval(()=>show(i+1),5500)};
const add=(id,q=1)=>{const p=P.find(x=>x.id==id);if(!p)return;const i=cart.find(x=>x.id==id),n=(i?i.qty:0)+q;if(n>p.stock)return toast('Estoque disponível: '+p.stock);if(i)i.qty=n;else cart.push({id:+id,qty:q});save();toast('Adicionado ao carrinho')};
const maps=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);
const store=(n,a)=>`<div class="store"><h3>Loja ${n}</h3><p>${esc(a)}</p><a class="btn" href="${maps(a)}" target="_blank" rel="noopener noreferrer" aria-label="Ver Loja ${n} no Google Maps">Ver no Google Maps</a></div>`;
const wa=()=>String(S.whatsapp||'').replace(/\D/g,'');
async function load(){[S,P]=await Promise.all([api('/api/store'),api('/api/products')]);cart=cart.filter(i=>P.find(p=>p.id==i.id));save();
 $('#foot').innerHTML=`<b>Mania de Aromas Outlet</b><p>Loja 1: ${esc(S.address)}<br>Loja 2: ${esc(S.address2)}<br>${esc(S.hours)}</p>`}
const views={
 home:()=>`<section class="hero"><div class="w"><h1>As marcas que você ama, com preços abaixo do catálogo.</h1><p>Perfumes, cosméticos e maquiagem com pronta entrega.</p><a class="btn dark" href="#/catalogo">Conhecer os produtos</a></div></section>
 <section class="sec w"><h2>Categorias</h2><div class="cats">${S.categories.map(c=>`<a href="#/catalogo/${c.id}">${esc(c.name)}</a>`).join('')}</div></section>
 <section class="sec w featured-section"><div class="feature-heading"><div><span class="eyebrow">SELEÇÃO ESPECIAL</span><h2>Produtos em destaque</h2></div><span class="muted">Escolhas da Mania de Aromas</span></div>${featureMarkup()}</section>
 ${S.about?`<section class="sec w"><h2>A marca</h2><p>${esc(S.about)}</p></section>`:''}`,
 contato:()=>`<section class="sec w"><h2>Contato</h2><div class="stores">${store(1,S.address)}${store(2,S.address2)}</div><div class="box"><p><b>Atendimento:</b> ${esc(S.hours)}</p>
 <p>${S.instagram?`<a class="btn" href="https://instagram.com/${encodeURIComponent(S.instagram)}" rel="noopener" target="_blank">Instagram @${esc(S.instagram)}</a> `:''}${wa()?`<a class="btn dark" href="https://wa.me/${wa().length<=11?'55'+wa():wa()}" rel="noopener" target="_blank">WhatsApp</a>`:'<span class="muted">WhatsApp: em configuração</span>'}</p></div></section>`,
 catalogo:()=>`<section class="sec w"><h2>Produtos</h2><div class="ctl"><input id="fq" type="search" placeholder="Buscar produto" aria-label="Buscar" value="${esc(F.q)}"><select id="fc" aria-label="Categoria"><option value="">Todas as categorias</option>${S.categories.map(c=>`<option value="${c.id}" ${F.cat==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
 <select id="fs" aria-label="Ordenar"><option value="name">Nome</option><option value="asc" ${F.sort=='asc'?'selected':''}>Menor preço</option><option value="desc" ${F.sort=='desc'?'selected':''}>Maior preço</option></select></div><div id="grid"></div></section>`,
 produto:id=>{const p=P.find(x=>x.id==id);if(!p)return'<section class="sec w"><p>Produto indisponível.</p></section>';const rel=P.filter(x=>x.category==p.category&&x.id!=p.id).slice(0,4);
  return`<section class="sec w"><div class="row" style="align-items:flex-start"><div class="product-gallery" style="flex:1;min-width:260px">${img(p)}${p.image2?`<img class="pi" src="${esc(p.image2)}" alt="${esc(p.name)} — segunda imagem">`:``}</div><div style="flex:1;min-width:260px"><small>${esc(p.category||'')}</small><h1 style="font-size:44px">${esc(p.name)}</h1><p>${pr(p)}</p><p>${esc(p.description)}</p><p class="muted">Disponível: ${p.stock}</p>
  <div class="row"><input id="qty" type="number" min="1" max="${p.stock}" value="1" aria-label="Quantidade" style="width:90px"><button class="btn dark" data-add="${p.id}" data-q>Adicionar ao carrinho</button></div></div></div>${rel.length?`<h2 style="margin:32px 0 16px">Relacionados</h2><div class="grid">${rel.map(card).join('')}</div>`:''}</section>`},
 carrinho:()=>{const L=cart.map(i=>({i,p:P.find(p=>p.id==i.id)})),tot=L.reduce((a,{i,p})=>a+un(p)*i.qty,0);
  if(!L.length)return'<section class="sec w"><h2>Carrinho</h2><p class="muted">Seu carrinho está vazio.</p><a class="btn dark" href="#/catalogo">Ver produtos</a></section>';
  return`<section class="sec w"><h2>Carrinho</h2><div class="box tw"><table><tr><th>Produto</th><th>Unitário</th><th>Qtd</th><th>Subtotal</th><th></th></tr>${L.map(({i,p})=>`<tr><td>${esc(p.name)}</td><td>${R(un(p))}</td><td><button class="btn" data-q="${p.id}" data-d="-1" aria-label="Diminuir">−</button> ${i.qty} <button class="btn" data-q="${p.id}" data-d="1" aria-label="Aumentar">+</button></td><td>${R(un(p)*i.qty)}</td><td><button class="btn" data-rm="${p.id}">Remover</button></td></tr>`).join('')}</table><h3>Total: ${R(tot)}</h3></div>
  <form id="co" class="box"><h3>Seus dados</h3><div class="form"><label>Nome<input name="name" required maxlength="100"></label><label>Telefone<input name="phone" type="tel" maxlength="30"></label><label>Forma de pagamento<select name="payment_method" required><option value="">Selecione</option><option value="dinheiro">À vista — dinheiro</option><option value="pix">À vista — Pix</option><option value="credito">Cartão de crédito</option><option value="debito">Cartão de débito</option><option value="boleto">Boleto</option></select></label><label>Modalidade<select name="delivery"><option value="retirada">Retirada na loja</option><option value="entrega">Entrega</option></select></label><label>Endereço (entrega)<input name="address" maxlength="250"></label></div>
  <p class="muted">A forma de pagamento escolhida será enviada à loja. O pedido fica aguardando atendimento e só é confirmado após a conversa com a equipe.</p><button class="btn dark" id="fin">Finalizar pelo WhatsApp</button><p class="err" id="ce"></p></form></section>`},
 pedido:c=>`<section class="sec w"><h2>Pedido ${esc(c)} registrado</h2><p>Ele está <b>aguardando atendimento</b>. Se o WhatsApp não abriu, use o botão abaixo e envie a mensagem. Pagamento e confirmação são combinados com a loja.</p><a class="btn dark" id="wl" target="_blank" rel="noopener">Abrir WhatsApp</a></section>`
};
function grid(){let l=P.filter(p=>(!F.cat||String(p.category_id)===String(F.cat))&&p.name.toLowerCase().includes(F.q.toLowerCase()));l.sort((a,b)=>F.sort=='asc'?un(a)-un(b):F.sort=='desc'?un(b)-un(a):a.name.localeCompare(b.name));
 $('#grid').innerHTML=l.length?`<div class="grid">${l.slice(0,F.n).map(card).join('')}</div>${l.length>F.n?'<p><button class="btn" id="more">Ver mais</button></p>':''}`:'<p class="muted">Nenhum produto encontrado.</p>'}
async function render(){const h=location.hash.slice(2).split('/'),r=h[0]||'home',v=$('#app');
 if(r!=='admin'&&!P.length&&!S.loaded){try{await load();S.loaded=1}catch{v.innerHTML='<p class="err">Erro ao carregar a loja.</p>';return}}
 if(r==='admin')return admin();
 if(r==='catalogo'&&h[1])F.cat=h[1];
 v.innerHTML=r==='produto'||r==='p'?views.produto(h[1]):r==='pedido'?views.pedido(h[1]):(views[r]||views.home)();if(r==='home')startFeatureCarousel();else if(featureTimer){clearInterval(featureTimer);featureTimer=null}
 if(r==='catalogo'){grid();$('#fq').oninput=e=>{F.q=e.target.value;F.n=12;grid()};$('#fc').onchange=e=>{F.cat=e.target.value;F.n=12;grid()};$('#fs').onchange=e=>{F.sort=e.target.value;grid()}}
 if(r==='pedido')$('#wl').href=sessionStorage.getItem('wa')||'#';
 if(r==='carrinho'&&$('#co'))$('#co').onsubmit=async e=>{e.preventDefault();$('#fin').disabled=true;$('#ce').textContent='';const f=Object.fromEntries(new FormData(e.target));
  try{const d=await api('/api/orders',{method:'POST',body:{...f,items:cart}});cart=[];save();sessionStorage.setItem('wa',d.whatsapp);window.open(d.whatsapp,'_blank','noopener');location.hash='#/pedido/'+d.code;P=[];S.loaded=0}catch(x){$('#ce').textContent=x.message;$('#fin').disabled=false}}}
document.addEventListener('pointerover',e=>{const im=e.target.closest('img.product-preview');if(im&&im.dataset.image2&&im.dataset.image2!==im.dataset.image1){im.src=im.dataset.image2;im.classList.add('is-alt')}});
document.addEventListener('pointerout',e=>{const im=e.target.closest('img.product-preview');if(im&&im.dataset.image1){im.src=im.dataset.image1;im.classList.remove('is-alt')}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.add){add(t.dataset.add,t.hasAttribute('data-q')?Math.max(1,+$('#qty').value||1):1)}
 else if(t.dataset.d){const i=cart.find(x=>x.id==t.dataset.q),p=P.find(x=>x.id==t.dataset.q),n=i.qty+ +t.dataset.d;if(n<1)return;if(n>p.stock)return toast('Estoque disponível: '+p.stock);i.qty=n;save();render()}
 else if(t.dataset.rm){cart=cart.filter(x=>x.id!=t.dataset.rm);save();render()}
 else if(t.id==='more'){F.n+=12;grid()}});
// ---------- admin
const ST={aguardando_atendimento:'Aguardando atendimento',em_atendimento:'Em atendimento',aguardando_pagamento:'Aguardando pagamento',confirmado:'Confirmado',em_preparacao:'Em preparação',pronto:'Pronto p/ retirada ou envio',concluido:'Concluído',cancelado:'Cancelado'};
let tab='resumo',edit=null;
async function admin(){const v=$('#app');try{await api('/api/admin/me')}catch{v.innerHTML=`<section class="sec w"><h2>Entrar</h2><form id="lg" class="box" style="max-width:380px"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><p class="err" id="le"></p><button class="btn dark">Entrar</button></form></section>`;
  $('#lg').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:Object.fromEntries(new FormData(e.target))});admin()}catch(x){$('#le').textContent=x.message}};return}
 v.innerHTML=`<section class="sec w"><div class="tabs">${[['resumo','Resumo'],['produtos','Produtos'],['pedidos','Pedidos'],['loja','Loja']].map(([k,n])=>`<button class="btn ${tab==k?'on':''}" data-tab="${k}">${n}</button>`).join('')}<button class="btn" id="out">Sair</button></div><div id="tb"></div></section>`;
 v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;edit=null;admin()});$('#out').onclick=async()=>{await api('/api/logout',{method:'POST'});admin()};
 try{await tabs[tab]($('#tb'))}catch(x){$('#tb').innerHTML=`<p class="err">${esc(x.message)}</p>`}}
const tabs={
 async resumo(el){const d=await api('/api/admin/dashboard'),k=(n,v)=>`<div class="box"><span class="muted">${n}</span><b>${v}</b></div>`;
  el.innerHTML=`<div class="kpis">${k('Produtos',d.products)}${k('Ativos',d.active)}${k('Inativos',d.products-d.active)}${k('Estoque baixo',d.low)}${k('Pedidos',d.orders)}${k('Aguardando atendimento',d.waiting)}${k('Concluídos',d.done)}${k('Vendas 30 dias',R(d.sales.revenue))}${k('Unidades vendidas (30 dias)',d.sales.units||0)}${k('Pedidos (30 dias)',d.sales.orders||0)}</div><div class="box"><b>Desempenho por produto</b>${d.top.length?`<div class="tw"><table><tr><th>Produto</th><th>Unidades</th><th>Faturamento</th></tr>${d.top.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.q}</td><td>${R(t.revenue)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Ainda não há vendas para analisar.</p>'}</div>`},
 async produtos(el){const [L,s]=await Promise.all([api('/api/admin/products'),api('/api/store')]),e=edit?L.find(p=>p.id==edit):null,m=n=>e&&e[n]!=null?e[n]/100:'';
  el.innerHTML=`<form id="pf" class="box"><h3>${e?'Editar':'Novo'} produto</h3><div class="form"><label>Nome*<input name="name" required value="${esc(e?.name)}"></label><label>SKU<input name="sku" value="${esc(e?.sku)}"></label><label>Categoria<select name="category_id"><option value="">—</option>${(await api('/api/admin/products')&&s.categories).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
  <label>Preço de venda (R$)*<input name="price" required inputmode="decimal" value="${m('price_cents')}"></label><label>Promocional (R$)<input name="promo" inputmode="decimal" value="${m('promo_cents')}"></label><label>Custo (R$)<input name="cost" inputmode="decimal" value="${m('cost_cents')}"></label>${e?'':'<label>Estoque inicial<input name="stock" type="number" min="0" value="0"></label>'}<label>Estoque mínimo<input name="min_stock" type="number" min="0" value="${e?e.min_stock:0}"></label><label>Imagem principal (JPG/PNG/WebP)<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Segunda imagem (JPG/PNG/WebP)<input name="image2" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="check-label"><input name="featured" type="checkbox" value="1" ${e?.featured?'checked':''}> Exibir na seção de destaques</label><label>Status<select name="active"><option value="1">Ativo</option><option value="0" ${e&&!e.active?'selected':''}>Inativo</option></select></label></div>
  <label>Descrição<textarea name="description" rows="3">${esc(e?.description)}</textarea></label><p class="err" id="pe"></p><button class="btn dark">Salvar</button> ${e?'<button type="button" class="btn" id="cn">Cancelar</button>':''}</form>
  <div class="box tw"><table><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr>${L.length?L.map(p=>`<tr><td>${esc(p.name)}<br><small class="muted">${esc(p.sku||'')}</small></td><td>${R(p.price_cents)}</td><td>${p.stock}${p.stock<=p.min_stock?' ⚠':''}</td><td>${p.active?'Ativo':'Inativo'}</td><td><button class="btn" data-e="${p.id}">Editar</button> <button class="btn" data-s="${p.id}">Ajustar estoque</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Nenhum produto cadastrado.</td></tr>'}</table></div>`;
  if(e)$('#pf [name=category_id]').value=e.category_id||'';
  $('#pf').onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/products'+(e?'/'+e.id:''),{method:e?'PUT':'POST',body:new FormData(ev.target)});edit=null;toast('Salvo');P=[];S.loaded=0;admin()}catch(x){$('#pe').textContent=x.message}};
  if($('#cn'))$('#cn').onclick=()=>{edit=null;admin()};el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{edit=b.dataset.e;admin();scrollTo(0,0)});
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const d=+prompt('Quantidade (use negativo para saída):');if(!d)return;const r=prompt('Motivo do ajuste:');if(!r)return;try{await api(`/api/admin/products/${b.dataset.s}/stock`,{method:'POST',body:{delta:d,reason:r}});P=[];S.loaded=0;admin()}catch(x){toast(x.message)}})},
 async pedidos(el){const L=await api('/api/admin/orders');el.innerHTML=L.length?L.map(o=>`<div class="box"><b>${esc(o.code)}</b> · ${esc(o.customer_name)} · ${esc(o.customer_phone||'')} · ${o.delivery}${o.address?' — '+esc(o.address):''}<br><small class="muted">${esc(o.created_at)} UTC</small><ul>${o.items.map(i=>`<li>${i.qty}x ${esc(i.name)} — ${R(i.unit_cents*i.qty)}</li>`).join('')}</ul><b>${R(o.total_cents)}</b><p class="muted">Pagamento: ${{dinheiro:'À vista — dinheiro',pix:'À vista — Pix',credito:'Cartão de crédito',debito:'Cartão de débito',boleto:'Boleto',a_combinar:'A combinar'}[o.payment_method]||o.payment_method}</p>
  <div class="row"><select data-o="${o.id}" aria-label="Status">${Object.entries(ST).map(([k,n])=>`<option value="${k}" ${o.status==k?'selected':''}>${n}</option>`).join('')}</select></div></div>`).join(''):'<p class="muted">Nenhum pedido registrado.</p>';
  el.querySelectorAll('[data-o]').forEach(s=>s.onchange=async()=>{if(s.value==='cancelado'&&!confirm('Cancelar devolve os itens ao estoque. Continuar?'))return admin();try{await api('/api/admin/orders/'+s.dataset.o,{method:'PUT',body:{status:s.value}});toast('Atualizado');P=[];S.loaded=0}catch(x){toast(x.message)}admin()})},
